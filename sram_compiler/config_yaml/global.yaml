# ============================================================================
# SRAM 6T电路优化配置文件
# SRAM 6T Circuit Optimization Configuration File
# ============================================================================

# global 参数配置
# 仿真参数 / Simulation parameters
vdd: 1.0                         # 供电电压(V) / Supply voltage (V)
temperature: 25                   # 温度(摄氏度) / Temperature (Celsius)
corner: "TT"                        # PDK工艺角 / PDK process corner/SS/FF/SF/FS
sram_cell_type: "SRAM_6T_CELL"      # 可选: "SRAM_6T_CELL" / "SRAM_10T_CELL"
TOTAL_capacity_KB: 32
num_rows: 16                      # SRAM行数 / Number of SRAM rows
num_cols: 16                        # SRAM列数 / Number of SRAM columns
monte_carlo_runs: 1               # 蒙特卡洛仿真次数 / Monte Carlo simulation runs/设计参数有几行就改成几
timeout: 120                      # 仿真超时时间(秒) / Simulation timeout (seconds)
choose_columnmux: false             # 是否选择列复用器 / Whether to choose column mux
# Driver sizing: lookup (default) selects fixed integer driver size classes from
# sram_compiler/sizing/sizing_lookup.json by row and column class, the same
# sizes for every cell candidate, PVT sample and RC configuration; unseen
# sizes round up to the next class and sizes beyond the table extrapolate the
# ladder (flagged, no evidence). Other modes: rules_only (the V2.0.5 continuous
# rules the classes derive from; options parasitic_factor/wd_floor_margin/k_w/
# pre_min) and auto (exact qualified-table match, otherwise rules_only). The
# legacy fixed mode was removed in V2.0.9.
sizing:
  mode: lookup
# Frozen array-class clock; SI seconds for a manual diagnostic override:
# timing: {mode: fixed, t_period: 1.0e-8}
timing:
  mode: lookup
  margin: 0.25
# Equivalent array model (sram_compiler/equivalent_modeling/README.md).
# 0 = full transistor array, the reference and the only mode whose per-device
# mismatch covers every cell; 1 = cross (target row and column real), 2 = target
# row, 3 = target column, 4 = target cell only. Modes 1-4 replace the remaining
# cells with extracted loads, keep every physical wire, and are approximations:
# never promote them to qualification evidence. `--real-cell-mode` and the
# testbench argument override this default.
equivalent:
  mode: 0
# Illustrative physical wires: 1 ohm / 0.1 fF per pitch, not foundry extraction.
# Replace this geometry with extracted values before timing qualification.
interconnect:
  mode: distributed
  cell_pin_rc: false
  wl: &reference_wire
    layer: M2-reference
    pitch_m: 6.0e-7
    width_m: 1.0e-7
    sheet_resistance_ohm: 0.16666666666666666
    capacitance_f_per_m: 1.6666666666666666e-10
    sections_per_half_pitch: 1
  bl:
    <<: *reference_wire
    layer: M3-reference
pdk_path_TT: "tran_models/models_TT.spice" # PDK路径 / PDK path
pdk_path_FF: "tran_models/models_FF.spice"
pdk_path_SS: "tran_models/models_SS.spice"
pdk_path_FS: "tran_models/models_FS.spice"
pdk_path_SF: "tran_models/models_SF.spice"

# 评估器配置 / Evaluator configuration
evaluator:
  class_name: "SRAMEvaluator"    # 评估器类名 / Evaluator class name
  module_path: "evaluators.sram_evaluator"  # 模块路径 / Module path

# 仿真器配置 / Simulator configuration
simulator:
  class_name: "Sram6TCoreMcTestbench"  # 测试平台类名 / Testbench class name
  # 测试平台模块路径 / Testbench module path
  module_path: "testbenches.sram_6t_core_MC_testbench"

# 性能指标定义 / Performance Metrics Definition
# 所有metrics定义一个范围，有具体范围的就是constraint，正负无穷的就是没有约束
performance_metrics:
  snm:
    type: "continuous list"      # 参数类型：连续型列表 / Parameter type: continuous list
    names: ['hold_snm', 'read_snm', 'write_snm'] # 各种噪声容限 / Static Noise Margins
    upper: [1.0, 2.0, 3.0]       # 参数范围上界 / Parameter upper bounds
    lower: [-1.0, -2.0, -3.0]    # 参数范围下界 / Parameter lower bounds
    aggregation: 'min'           # 聚合方式：平均，max, min / Aggregation type: average, max, min
    description: "Static noise margins / 静态噪声容限"
  power:
    type: "continuous list"      # 参数类型：连续型列表 / Parameter type: continuous list
    names: ['read_power', 'write_power'] # 读写功耗 / Read Write power
    upper: [1.0, 2.0]            # 参数范围上界 / Parameter upper bounds
    lower: [0.0, 0.0]          # 参数范围下界 / Parameter lower bounds
    aggregation: 'max'           # 聚合方式：平均，max, min / Aggregation type: average, max, min
    description: "Operation power consumption / 操作功耗"
  delay:
    type: "continuous list"      # 参数类型：连续型列表 / Parameter type: continuous list
    names: ['read_delay', 'write_delay'] # 读写延迟 / Read Write delay
    # 此处变为约束 / These are constraints
    upper: [2.0e-10, 1.0e-10]        # 参数范围上界 / Parameter upper bounds
    lower: [0.0, 0.0]            # 参数范围下界 / Parameter lower bounds
    # penalty: [1.0e6, 1.0e6]    # 暂时不考虑约束
    description: "Read and write operation delay / 读取和写入操作延迟"
  area:
    type: "continuous scalar"    # 参数类型：连续型标量 / Parameter type: continuous scalar
    names: "area"
    upper: 1.0
    lower: 0.0
    formula: "estimate_bitcell_area(pd_width, pu_width, pg_width, length)"  # 计算公式 / Calculation formula
    description: "SRAM cell area / SRAM单元面积"

# 复合目标函数配置 / Composite Objective Function Configuration
# 目标函数的输入从 performance_metrics 中挑选 [snm, power, delay, area]
objectives:
  type: "merit_function"       # 复合函数类型：Merit函数 / Composite function type: merit function
  formula: "log10(snm / (power * sqrt(area)))"  # Merit函数公式 / Merit function formula
  constraints: 'delay' # 待定
  description: "SRAM Merit function combining SNM, power and area / SRAM Merit函数，结合SNM、功耗和面积"
