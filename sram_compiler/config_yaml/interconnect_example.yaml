# Illustrative wire geometry for diagnostics (V2.0.7+), NOT foundry extraction.
# Each pitch contributes 1 ohm and 0.1 fF. Supply extracted values for signoff.
mode: distributed
cell_pin_rc: false
wl: &wire
  layer: M2-reference
  pitch_m: 6.0e-7
  width_m: 1.0e-7
  sheet_resistance_ohm: 0.16666666666666666
  capacitance_f_per_m: 1.6666666666666666e-10
  sections_per_half_pitch: 1
bl:
  <<: *wire
  layer: M3-reference
